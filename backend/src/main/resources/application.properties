spring.application.name=backend

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fraud_detection}
spring.datasource.username=${DB_USERNAME:fraud_detection}
spring.datasource.password=${DB_PASSWORD:fraud_detection}

# JPA / Hibernate - el esquema lo gestiona Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-env-file-minimum-256-bits-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
