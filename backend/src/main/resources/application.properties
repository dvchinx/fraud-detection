spring.application.name=backend

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:fraud_detection}
spring.datasource.username=${DB_USERNAME:fraud_detection}
spring.datasource.password=${DB_PASSWORD:fraud_detection}

# JPA / Hibernate - el esquema lo gestiona Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=fraud-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.florez.backend.transaction
spring.kafka.consumer.properties.spring.json.value.default.type=com.florez.backend.transaction.TransactionCreatedMessage

spring.kafka.listener.ack-mode=record

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-env-file-minimum-256-bits-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Motor de reglas de fraude
fraud.rules.review-amount-threshold=1000
fraud.rules.block-amount-threshold=10000
fraud.rules.velocity-max-count=5
fraud.rules.velocity-window-seconds=300
fraud.rules.ml-review-threshold=0.5
fraud.rules.ml-block-threshold=0.85

# Servicio de ML (Fase 4) - si no responde a tiempo, la regla se omite (fail-open)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.connect-timeout-ms=1000
ml.service.read-timeout-ms=2000

# Observabilidad - /actuator/health es publico (healthchecks); metrics y
# prometheus quedan detras del JWT como el resto de la API.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
