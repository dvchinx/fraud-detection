services:
  postgres:
    image: postgres:16
    container_name: backend-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-fraud_detection}
      POSTGRES_USER: ${DB_USERNAME:-fraud_detection}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fraud_detection}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fraud_detection}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: backend-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: backend-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners de datos: PLAINTEXT para trafico entre contenedores
      # (kafka:19092) y PLAINTEXT_HOST para clientes en la maquina host
      # (localhost:9092), que es lo que usan ./mvnw spring-boot:run y los
      # scripts de ml/.
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  ml-service:
    build:
      context: ../ml
    container_name: backend-ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Perfil "full": levanta tambien la API. Sin el perfil, docker-compose solo
  # levanta la infraestructura y la API se corre en local con ./mvnw.
  backend:
    profiles: ["full"]
    build:
      context: .
    container_name: backend-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fraud_detection}
      DB_USERNAME: ${DB_USERNAME:-fraud_detection}
      DB_PASSWORD: ${DB_PASSWORD:-fraud_detection}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-env-file-minimum-256-bits-long}
      # Logs en JSON dentro del contenedor; en local siguen siendo legibles.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
